[project]
name = "polybot"
version = "0.1.0"
description = "Polymarket 5-min BTC Up/Down latency arbitrage bot"
requires-python = ">=3.9"
dependencies = [
    "py-clob-client>=0.34.5",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "aiosqlite>=0.19",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
]

[project.scripts]
polybot = "core.orchestrator:main"

[tool.setuptools.packages.find]
include = ["api*", "config*", "core*", "feeds*", "market*", "persistence*", "strategy*", "trading*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
